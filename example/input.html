<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">        
        <title>Simple Example</title>

        <style type="text/css">
            * { margin:0; padding:0; border:none; font-family:Consolas, Monospace; font-size:15px;}
            html, body { width:100%; height:100%; }
            body { padding: 10px; box-sizing: border-box; }
        </style>

        <script type="module">
            import {Shell} from '../src/Shell.mjs';

            /**
             * 
             * "/wait" command
             * .. wait a given number of seconds before returning shell input access to user
             * 
             * .. will request number of seconds to wait from user
             * .. prints "tick.." every seconds while waiting
             * .. finishes command execution when given number of seconds has been reached
             * 
            **/
            const commandWait = {
                match: function(_input) {
                    if(_input.startsWith('/wait')) {
                        return true;
                    }

                    return false;
                },

                process: function(_inputData, _intermediateIOInterface) { 
                    return new Promise(async (_resolve, _reject) => {
                        const numSecStr = await _intermediateIOInterface.requestInput("Enter number of seconds:", false);
                        const numSec = Number.parseInt(numSecStr);

                        if(!Number.isInteger(numSec)) {
                            return _reject(["invalid input for command."]);
                        }

                        const intv = setInterval(() => {
                            _intermediateIOInterface.writeLine("tick..");
                        }, 1000);

                        setTimeout(() => {
                            clearInterval(intv);
                            _resolve(["finished."]);
                        }, numSec * 1000);
                    });
                }
            };

            window.document.addEventListener('DOMContentLoaded', (e) => {
                const shell = new Shell(document.getElementById("shell"), `>>`);
                shell.writeLine(`◕_◕ Example of requesting input`);
                shell.addCommand(commandWait);
            });
        </script>

    </head>

    <body>
        <div id="shell"></div>
    </body>

</html>
